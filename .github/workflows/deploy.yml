name: Deploy to AWS

on:
  push:
    branches: [ main ]

jobs:
  # Step1: GitHub Actions 側でビルド → ghcr.io にプッシュ
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lifegauge:latest
          build-args: |
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}

  # Step2: EC2 は pull して起動するだけ
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=40 \
              -o ConnectTimeout=10 \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
              'bash -s' << 'ENDSSH'
          set -e

          echo "=== 最新イメージをプル ==="
          sudo docker pull ghcr.io/noriki06/lifegauge:latest

          echo "=== コンテナを再起動 ==="
          sudo docker stop lifegauge || true
          sudo docker rm lifegauge || true
          sudo docker run -d \
            --name lifegauge \
            --env-file /home/ec2-user/app.env \
            -p 3000:3000 \
            --restart unless-stopped \
            ghcr.io/noriki06/lifegauge:latest

          echo "=== マイグレーション実行 ==="
          sleep 5
          sudo docker exec lifegauge bundle exec rails db:migrate

          echo "=== 古いイメージを削除 ==="
          sudo docker image prune -f

          echo "=== デプロイ完了 ==="
          sudo docker ps | grep lifegauge || true
          ENDSSH
