name: Deploy to AWS

on:
  push:
    branches: [ main ]

jobs:
  # Step1: GitHub Actions 側でビルド → ghcr.io にプッシュ
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/lifegauge:latest
          build-args: |
            RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}

  # Step2: EC2 は pull して起動するだけ（SSH 接続は30秒以内）
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: read

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 5m
          command_timeout: 5m
          script: |
            set -e

            echo "=== 最新イメージをプル ==="
            sudo docker pull ghcr.io/${{ github.repository_owner }}/lifegauge:latest

            echo "=== コンテナを再起動 ==="
            sudo docker stop lifegauge || true
            sudo docker rm lifegauge || true
            sudo docker run -d \
              --name lifegauge \
              --env-file /home/ec2-user/app.env \
              -p 3000:3000 \
              --restart unless-stopped \
              ghcr.io/${{ github.repository_owner }}/lifegauge:latest

            echo "=== マイグレーション実行 ==="
            sleep 5
            sudo docker exec lifegauge bundle exec rails db:migrate

            echo "=== 古いイメージを削除 ==="
            sudo docker image prune -f

            echo "=== デプロイ完了 ==="
            sudo docker ps | grep lifegauge || true
